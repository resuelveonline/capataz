openapi: 3.0.3
info:
  title: Capataz API
  version: 0.2.3
  license:
    name: Propietaria
  description: >
    API del host (Capataz). La consumen el portal web y las apps Flutter
    (Android/iOS). Capataz es la única puerta hacia Syncthing: los clientes
    nunca hablan con él. Los enlaces temporales se preparan en el host y se
    publican en Capataz Nube (hosting compartido), que es quien sirve la
    descarga pública y decide el vencimiento.
    Las operaciones marcadas con x-roles [titular] las rechaza el servidor con
    403 si el token no pertenece a la cuenta titular.
    Respuestas comunes a todas las rutas: 405 (método no permitido, con
    header Allow) e invalid_request en el cuerpo. La descarga pública
    (/s/{token}, /s/{token}/meta y /s/{token}/blob) no es de esta API: la
    sirve Capataz Nube y está en api/capataz-nube-api.yaml.

servers:
  - url: http://localhost:8080
    description: Etapa 1 (local)

security:
  - bearerAuth: []

tags:
  - name: Instancia
    description: Identidad pública de la instancia.
  - name: Autenticación
    description: Emparejamiento de dispositivos y renovación de tokens.
  - name: Dispositivos
    description: Gestión de dispositivos emparejados (solo titular).
  - name: Archivos
    description: Navegar, subir, descargar y organizar archivos de la instancia.
  - name: Enlaces
    description: Enlaces temporales de solo lectura.

paths:
  /instance:
    get:
      operationId: getInstance
      tags: [Instancia]
      summary: Identidad de la instancia (sin datos sensibles)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instance" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /auth/pair:
    post:
      operationId: pairDevice
      tags: [Autenticación]
      summary: Empareja un dispositivo con un código de un solo uso (QR)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode, deviceName, platform]
              properties:
                pairingCode: { type: string }
                deviceName:  { type: string, maxLength: 80 }
                platform:    { type: string, enum: [web, android, ios] }
      responses:
        "200":
          description: Credenciales del dispositivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Autenticación]
      summary: Renueva el token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nuevo par de tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /pairing-codes:
    post:
      operationId: createPairingCode
      tags: [Autenticación]
      summary: Genera un código/QR de emparejamiento de un solo uso
      x-roles: [titular]
      responses:
        "201":
          description: Código generado (vigencia corta)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCode" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /devices:
    get:
      operationId: listDevices
      tags: [Dispositivos]
      summary: Lista los dispositivos emparejados
      x-roles: [titular]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /devices/{id}:
    delete:
      operationId: revokeDevice
      tags: [Dispositivos]
      summary: Revoca un dispositivo (sus tokens dejan de funcionar)
      x-roles: [titular]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Revocado }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /folders:
    get:
      operationId: listFolders
      tags: [Archivos]
      summary: Lista las carpetas visibles de la instancia
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Folder" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /files:
    get:
      operationId: listFiles
      tags: [Archivos]
      summary: Lista el contenido de una ruta
      parameters:
        - { $ref: "#/components/parameters/FolderQ" }
        - { name: path, in: query, required: false, schema: { type: string, default: "" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadFile
      tags: [Archivos]
      summary: Sube un archivo (Fase 3)
      parameters:
        - { $ref: "#/components/parameters/FolderQ" }
        - { $ref: "#/components/parameters/PathQ" }
        - { name: overwrite, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFile
      tags: [Archivos]
      summary: Borra un archivo o carpeta
      parameters:
        - { $ref: "#/components/parameters/FolderQ" }
        - { $ref: "#/components/parameters/PathQ" }
      responses:
        "204": { description: Borrado }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /files/mkdir:
    post:
      operationId: createFolder
      tags: [Archivos]
      summary: Crea una carpeta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, path]
              properties:
                folder: { type: string }
                path:   { type: string }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /files/move:
    post:
      operationId: moveEntry
      tags: [Archivos]
      summary: Renombra o mueve un archivo o carpeta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, from, to]
              properties:
                folder: { type: string }
                from:   { type: string }
                to:     { type: string }
      responses:
        "200":
          description: Movido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /files/download:
    get:
      operationId: downloadFile
      tags: [Archivos]
      summary: Descarga un archivo (admite Range para reanudar)
      parameters:
        - { $ref: "#/components/parameters/FolderQ" }
        - { $ref: "#/components/parameters/PathQ" }
        - { name: Range, in: header, required: false, schema: { type: string, example: "bytes=0-1048575" } }
        - { name: If-Modified-Since, in: header, required: false, schema: { type: string } }
        - { name: If-Unmodified-Since, in: header, required: false, schema: { type: string } }
        - { name: If-Range, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Contenido completo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Contenido parcial }
        "304": { description: Sin cambios desde If-Modified-Since (sin cuerpo) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412":
          description: If-Unmodified-Since no se cumple (code invalid_request)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "416":
          description: Rango no satisfacible (code invalid_request, header Content-Range bytes */N)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /links:
    post:
      operationId: createLink
      tags: [Enlaces]
      summary: Crea un enlace temporal de solo lectura (asíncrono)
      description: >
        Capataz prepara una copia congelada de los elementos (escaneo, verificación
        de estado, copia a staging, verificación posterior), la cifra con CPK1, la
        sube a Capataz Nube y publica el enlace. Responde de inmediato con el
        enlace en estado `preparing`; el cliente consulta GET /links/{id} hasta
        que esté `active` (con `url`) o `failed` (con `failureCode`). La copia no
        sigue cambios posteriores de Syncthing.

        Antes del 202 solo se valida la petición: forma del JSON, vigencia,
        número de elementos, que cada carpeta la reporte Syncthing y que cada
        ruta sea admisible (sin ../ ni enlaces simbólicos). Lo demás (que esté
        indexado y sincronizado, el tope de 500 MiB, el espacio en disco, que no
        cambie durante la copia, la subida) se informa después en `failureCode`.
      x-roles: [titular]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkRequest" }
      responses:
        "202":
          description: Enlace en preparación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "400":
          description: >
            invalid_request (JSON, vigencia, elementos repetidos o encryption=none)
            o path_not_allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: not_found (carpeta o ruta inexistente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: payload_too_large (cuerpo de la petición mayor de 64 KiB)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate_limited (ya hay demasiados enlaces en preparación o subida)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    get:
      operationId: listLinks
      tags: [Enlaces]
      summary: Lista los enlaces
      x-roles: [titular]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/LinkStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /links/{id}:
    get:
      operationId: getLink
      tags: [Enlaces]
      summary: Consulta el estado de un enlace
      x-roles: [titular]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeLink
      tags: [Enlaces]
      summary: Revoca un enlace y borra su copia (requiere conexión con Capataz Nube)
      description: >
        Un enlace en `preparing` se cancela y queda `revoked` sin hablar con la
        nube. Uno en `uploading` o `active` se revoca primero en Capataz Nube; si
        no se puede, responde 502 cloud_unreachable y el enlace sigue como
        estaba. Es idempotente: un enlace ya `revoked`, `expired` o `failed`
        responde 204.
      x-roles: [titular]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Revocado }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    FolderQ:
      name: folder
      in: query
      required: true
      schema: { type: string }
    PathQ:
      name: path
      in: query
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Código estable para que portal y apps lo traduzcan igual.
            syncthing_unavailable (502) indica que Capataz no pudo hablar con
            Syncthing; internal_error (500) es un fallo interno cuyo detalle
            solo queda en la bitácora del servidor. insufficient_storage indica
            que el staging del host no tiene espacio para la copia congelada.
            Los códigos de enlace (file_*, payload_too_large,
            insufficient_storage, cloud_*) suelen llegar en Link.failureCode y
            no como respuesta HTTP.
          enum:
            - unauthorized
            - forbidden
            - not_found
            - invalid_request
            - path_not_allowed
            - file_in_use
            - file_not_synced
            - file_changed_during_copy
            - already_exists
            - payload_too_large
            - insufficient_storage
            - rate_limited
            - link_expired
            - link_revoked
            - cloud_unreachable
            - cloud_quota_exceeded
            - syncthing_unavailable
            - internal_error
        message: { type: string }

    Instance:
      type: object
      properties:
        instanceId: { type: string }
        name:       { type: string }
        version:    { type: string }
        publicMode: { type: string, enum: [local, nube] }

    TokenPair:
      type: object
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }
        expiresIn:    { type: integer, description: Segundos de vida del accessToken }
        role:         { type: string, enum: [titular, device] }

    PairingCode:
      type: object
      properties:
        code:      { type: string }
        expiresAt: { type: string, format: date-time }

    Device:
      type: object
      properties:
        id:         { type: string }
        name:       { type: string }
        platform:   { type: string, enum: [web, android, ios] }
        createdAt:  { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }

    Folder:
      type: object
      properties:
        id:    { type: string }
        label: { type: string }

    Entry:
      type: object
      properties:
        name:     { type: string }
        path:     { type: string }
        isDir:    { type: boolean }
        size:     { type: integer, format: int64 }
        modified: { type: string, format: date-time }

    LinkStatus:
      type: string
      enum: [preparing, uploading, active, failed, expired, revoked]

    LinkRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/LinkItem" }
        ttlSeconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          default: 86400
          description: Vigencia en segundos (mínimo 1 hora, máximo 30 días, por defecto 24 horas)
        maxDownloads: { type: integer, minimum: 1, nullable: true, description: "null o ausente: sin tope" }
        label:
          type: string
          maxLength: 120
          description: Nombre visible para el titular y base del nombre del ZIP con varios elementos
        encryption:
          type: string
          enum: [none, client]
          default: client
          description: >
            client: paquete CPK1 cifrado de extremo a extremo; la clave va solo
            en el fragmento # de la URL. none está reservado y en esta versión se
            rechaza con 400 invalid_request (Capataz Nube solo guarda CPK1).

    LinkItem:
      type: object
      required: [folder, path]
      properties:
        folder: { type: string, description: Id de carpeta de Syncthing }
        path:   { type: string, description: Ruta relativa a la carpeta (archivo o carpeta) }

    Link:
      type: object
      required: [id, status, progress, createdAt, expiresAt, downloads, items, encryption]
      properties:
        id:           { type: string }
        url:
          type: string
          nullable: true
          description: >
            https://sync.softmx.net/s/<token>#<clave>. Solo con status=active;
            null en los demás estados. La clave del fragmento la guarda el host
            (archivo 0600 en CAPATAZ_STATE_DIR) mientras el enlace está vigente y
            se borra al expirar, revocar o fallar; Capataz Nube nunca la recibe.
        label:        { type: string, nullable: true }
        status:
          allOf:
            - $ref: "#/components/schemas/LinkStatus"
          description: >
            El estado exhausted de Capataz Nube (cupo de descargas agotado) se
            muestra como expired.
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Fracción del paquete ya subida (0 en preparing, 1 en active)
        failureCode:
          type: string
          nullable: true
          description: Un código del enum de Error; solo con status=failed
        createdAt:    { type: string, format: date-time }
        expiresAt:    { type: string, format: date-time }
        downloads:    { type: integer }
        maxDownloads: { type: integer, nullable: true }
        items:        { type: array, items: { $ref: "#/components/schemas/LinkItem" } }
        payloadSize:
          type: integer
          format: int64
          nullable: true
          description: Bytes de la carga útil en claro (el archivo o el ZIP); null hasta prepararla
        payloadSha256:
          type: string
          nullable: true
          description: SHA-256 en hexadecimal de la carga útil en claro
        packageSize:
          type: integer
          format: int64
          nullable: true
          description: Bytes del paquete CPK1 que se sube a Capataz Nube
        packageSha256:
          type: string
          nullable: true
          description: SHA-256 en hexadecimal del paquete CPK1
        skipped:
          type: object
          nullable: true
          description: >
            Elementos omitidos dentro de carpetas seleccionadas, por motivo y sin
            nombres. El cliente los muestra como aviso.
          properties:
            ignored: { type: integer, description: Ignorados por .stignore }
            hidden:  { type: integer }
            symlink: { type: integer }
            special: { type: integer }
        encryption:   { type: string, enum: [none, client] }
