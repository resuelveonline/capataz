franciscocarvajal@Macmini capataz % >....                                                                                                                              
H="X-API-Key: $SYNCTHING_API_KEY"
FID=$(curl -s -H "$H" $SYNCTHING_URL/rest/config/folders | jq -r '.[] | select(.label=="pruebas") | .id')
P=~/capataz-dev/sync/pruebas

echo "### A) db/need completo"
curl -s -H "$H" "$SYNCTHING_URL/rest/db/need?folder=$FID" | jq .

echo "### B) modifico uno.txt y consulto SIN escanear"
echo "texto agregado" >> $P/uno.txt
curl -s -H "$H" "$SYNCTHING_URL/rest/db/file?folder=$FID&file=uno.txt" | jq '{indice_size: .local.size, indice_modified: .local.modified}'
stat -f "disco: size=%z mtime=%Sm" $P/uno.txt

echo "### C) escaneo solo ese archivo y vuelvo a consultar"
curl -s -X POST -H "$H" "$SYNCTHING_URL/rest/db/scan?folder=$FID&sub=uno.txt"
sleep 2
curl -s -H "$H" "$SYNCTHING_URL/rest/db/file?folder=$FID&file=uno.txt" | jq '{indice_size: .local.size, indice_modified: .local.modified}'

echo "### D) borro dos.txt y consulto tras escanear"
rm $P/dos.txt
curl -s -X POST -H "$H" "$SYNCTHING_URL/rest/db/scan?folder=$FID&sub=dos.txt"
sleep 2
curl -s -H "$H" "$SYNCTHING_URL/rest/db/file?folder=$FID&file=dos.txt" | jq '{deleted_local: .local.deleted, deleted_global: .global.deleted}'

echo "### E) archivo en subcarpeta, con la ruta codificada"
curl -s -G -H "$H" --data-urlencode "folder=$FID" --data-urlencode "file=subcarpeta/tres.txt" \
  "$SYNCTHING_URL/rest/db/file" | jq '{name: .local.name, size: .local.size}'
